name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install llvm libomp ninja
      - name: Build
        run: bash scripts/build.sh debug all
      - name: Test
        run: ctest --test-dir build/debug --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Practice all -ToolchainBin "$(cygpath -w /ucrt64/bin)"
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build/debug --output-on-failure
      - name: CMake diagnostics
        if: failure()
        shell: msys2 {0}
        run: |
          g++ --version
          cmake --version
          if test -f build/debug/CMakeFiles/CMakeConfigureLog.yaml; then
            tail -n 250 build/debug/CMakeFiles/CMakeConfigureLog.yaml
          fi
